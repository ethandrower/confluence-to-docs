[project]
name = "confluence-to-docs"
version = "0.1.0"
description = "Pull Confluence docs and serve them through a clean, searchable portal"
requires-python = ">=3.12"
dependencies = [
    "Django>=4.2,<5.0",
    "djangorestframework>=3.14",
    "django-environ>=0.11",
    "psycopg2-binary>=2.9",
    "celery>=5.3",
    "django-celery-beat>=2.5",
    "redis>=5.0",
    # Real-time: Channels serves the websocket protocol, channels_redis is the
    # cross-worker layer, uvicorn is the ASGI worker class used in the Procfile.
    "channels[daphne]>=4,<5",
    "channels_redis>=4",
    "uvicorn[standard]>=0.30",
    # INSTALLED_APPS / MIDDLEWARE reference these at import time, so the app
    # cannot boot without them. See requirements.txt for the anymail<15 pin.
    "whitenoise>=6.6",
    "django-anymail[mailgun]>=14,<15",
    "markdown>=3.5",
    "lxml>=4.9",
    "bleach>=6.0",
    "django-storages>=1.14",
    "boto3>=1.28",
    "requests>=2.31",
    "Pillow>=10.0",
    "gunicorn>=21.0",
    "trinity-atlassian-cli",
]

[tool.uv.sources]
trinity-atlassian-cli = { git = "https://github.com/ethandrower/atlassian-trinity.git" }
