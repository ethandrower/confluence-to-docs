# Stands in for Dokku's nginx layer in the production-parity stack.
#
# Its whole job is the X-Forwarded-Proto header. With DEBUG off, Django turns on
# SECURE_SSL_REDIRECT, and it decides whether a request is already secure by
# reading SECURE_PROXY_SSL_HEADER — which settings.py sets to this header. In
# production Dokku's nginx terminates TLS and sets it; without something doing
# the same locally, every request would 301 to an https port that isn't there.
#
# Declaring https over a plain-http hop is exactly what a TLS terminator does,
# and it is safe here only because this file is never deployed: it binds to
# localhost in a compose profile. Do not lift it into a real environment, where
# it would let a client assert its own connection was encrypted.
server {
    # Both, from one server block: nginx applies TLS only to the 443 listener.
    #
    # Port 80 is for you in a browser — Chrome treats localhost as a trustworthy
    # origin and stores Secure cookies over plain http there, so signing in at
    # http://localhost:8090 works.
    #
    # Port 443 exists because non-browser clients do NOT make that exception.
    # With DEBUG=False Django sets SESSION_COOKIE_SECURE and CSRF_COOKIE_SECURE,
    # so `manage.py smoke` over http gets a Secure cookie it will never send
    # back, and every authenticated check fails with a 403 that looks like a
    # CSRF bug and isn't. Serving real TLS removes the artifact and exercises
    # the secure-cookie path production actually uses.
    listen 80;
    listen 443 ssl;
    server_name localhost proxy;

    # Self-signed, generated into a volume by the `certgen` service on first
    # start — deliberately never committed, so there is no private key in the
    # repo for a scanner to find or a human to mistake for a real one.
    ssl_certificate     /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;

    # Large enough for the file-share flows; browser→S3 PUTs bypass this proxy
    # entirely (presigned, direct to the store), but the download-all zip does
    # come back through here.
    client_max_body_size 64m;

    location / {
        proxy_pass http://web:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # The app speaks ASGI and uses Channels; without these a WebSocket
        # upgrade is silently downgraded to a plain request and real-time
        # quietly stops working — the exact class of bug this stack exists
        # to surface before a deploy does.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Matches the gunicorn --timeout 120 the web container runs with, so a
        # slow response fails the same way here as it would in production
        # rather than being cut short earlier by the proxy.
        proxy_read_timeout 120s;
    }
}
