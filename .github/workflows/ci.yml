name: CI

# Runs the suites nobody was running. Before this, 423 backend tests and 21
# frontend tests only ever executed if someone remembered to type the command —
# including the URLconf sweep test that asserts no write view is left without
# CSRF protection, so that security property could regress silently.

on:
  pull_request:
  push:
    branches: [main]
  # Re-run a flake, or a run whose service container failed to come up, without
  # pushing an empty commit to do it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only supersede runs on a pull request, where a force-push makes the previous
  # run irrelevant. NOT on main: cancelling there leaves that commit reporting
  # "cancelled" rather than "success", which is exactly wrong for a branch whose
  # protection rules are meant to require this check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Django tests
    runs-on: ubuntu-latest
    # The default is 360 minutes. A job that hangs — a service container that
    # never reports healthy, or an async test blocking on a socket — would burn
    # six hours of runner time and leave the PR stuck "in progress". The suite
    # takes about a minute, so this is generous.
    timeout-minutes: 15

    services:
      # Test against the engine production actually runs. Without this,
      # DATABASE_URL falls back to sqlite (settings.py) and two things go
      # untested: the _is_postgres() branch in portal/models.py, which then
      # exists only in production, and every column-length constraint — a value
      # too long for its column is a DataError on Postgres and silently accepted
      # by SQLite, which is exactly how an over-length link_url reached #52.
      #
      # NOT -alpine, deliberately, even though docker-compose.yml uses it.
      # Alpine is musl-based and collates text by byte value, while the official
      # Debian image (what dokku-postgres runs) uses real glibc locale
      # collation. Both report datcollate=en_US.utf8, so the difference is
      # invisible to inspection: ('apple','Banana','acme') sorts as
      # Banana,acme,apple on alpine and acme,apple,Banana on Debian.
      #
      # That reaches ORDER BY on every text column — DocPage.Meta.ordering
      # (page tree order), Company.Meta.ordering, and most sharply
      # CompanyCursorPagination.ordering = ('name','pk'), the keyset boundaries
      # the /api/v1/ integration consumer pages through. Testing those against a
      # different collation than production would prove nothing about them.
      #
      # Major version should track production; confirm with
      # `dokku postgres:info citemed-docs` and change here if it differs.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citemed
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Note what this container is and isn't for. test_channel_layer_config
      # only INSPECTS the channel-layer config, so it needs REDIS_URL set (see
      # env below) but not a reachable server — verified by pointing it at a
      # dead port, where it still passes. The container is here for the live
      # PING probe in portal/tests/test_health.py, which arrives with #50 and
      # skips when nothing is listening. Kept deliberately: a test that silently
      # skips forever is the failure mode this whole workflow exists to end.
      redis:
        image: redis:7-alpine
        # 6380 to match docker-compose.yml and the URL that test asserts on.
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Django's test runner creates and drops test_citemed itself; the service
      # container's superuser has the rights for that.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/citemed
      # DEBUG=True is required, not laziness: with it off, settings.py enables
      # SECURE_SSL_REDIRECT, and Django's test client speaks http — so every
      # request becomes a 301 and the suite fails ~240 tests on redirects alone.
      # Making the suite runnable under production-shaped settings is a separate
      # piece of work.
      DEBUG: 'True'
      # Set explicitly so this keeps working once SECRET_KEY becomes mandatory
      # (#7 removes the dev fallback), and so no run depends on a fallback.
      # CI-only value; it signs nothing that outlives the job.
      SECRET_KEY: github-actions-ephemeral-key-not-used-for-anything-real
      # Selects the Redis channel layer, which is what makes
      # test_channel_layer_config execute rather than skip. That test guards the
      # redis-py 8 socket_timeout regression that dropped customers' live
      # connections in production (fbb4339).
      REDIS_URL: redis://127.0.0.1:6380/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # requirements.txt pins trinity-atlassian-cli to a git commit; the repo
        # is public, so no credentials are needed here.
        run: pip install -r requirements.txt

      - name: Check for models changed without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        # No app label: `test portal` would silently ignore tests added anywhere
        # else. Bare discovery finds the same set today.
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 to match what production actually builds with — the root
          # package.json declares engines.node 22.x for the Dokku Node
          # buildpack, and docker-compose uses node:22-slim. Building here on a
          # different major would let CI pass green on a build the deploy then
          # fails.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # The Node buildpack runs this during deploy, so a build broken here is
        # a deploy broken in production. Note it does NOT cover collectstatic
        # under manifest static storage, which DEPLOY.md flags as a release-time
        # failure mode — the `smoke` job below is what covers that.
        run: npm run build

  smoke:
    name: Production-parity smoke test
    runs-on: ubuntu-latest
    # Builds a Vue bundle and a Python image from scratch, so it is the slowest
    # job here by a wide margin. Still bounded well under the 360-minute
    # default, for the same reason the others are.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build and start the production-parity stack
        # This is the step the other two jobs cannot do. `backend` runs Django
        # with DEBUG=True and no bundle; `frontend` builds the bundle but never
        # collects it. Only here do the two meet: vite build, then collectstatic
        # through CompressedManifestStaticFilesStorage at image-build time,
        # then gunicorn behind nginx with DEBUG=False — the shape Dokku runs.
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for the app to answer
        # `depends_on: service_completed_successfully` gets migrations done
        # before web starts, but gunicorn still needs a moment to bind. Poll
        # the endpoint Dokku's own zero-downtime check polls.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8090/healthz/ >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "app never became healthy"; exit 1

      - name: Walk the customer journey
        # From `release`, not `web`: `compose run web` starts a second container
        # answering to the same `web` DNS name and Docker round-robins between
        # them, which makes results nondeterministic.
        #
        # --insecure is for the stack's own self-signed cert. TLS is not
        # decoration here: with DEBUG=False Django sets SESSION_COOKIE_SECURE,
        # and an ordinary HTTP client will not send a Secure cookie back over
        # plain http, so sign-in would fail for a reason that has nothing to do
        # with the code under test.
        run: |
          docker compose -f docker-compose.prod.yml run --rm --no-deps release \
            python manage.py smoke --url https://proxy --insecure

      - name: Container logs
        # The smoke test reports which check failed; this says why. Without it
        # a red run means re-running the whole thing locally to find out.
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=200
