name: CI

# Runs the suites nobody was running. Before this, 500+ backend tests and the
# frontend tests only ever executed if someone remembered to type the command —
# including the URLconf sweep test that asserts no write view is left without
# CSRF protection, so that security property could regress silently.

on:
  pull_request:
  push:
    branches: [main]
  # Re-run a flake, or a run whose service container failed to come up, without
  # pushing an empty commit to do it.
  workflow_dispatch:

# One run per branch: a force-push supersedes the run it replaces instead of
# queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Django tests
    runs-on: ubuntu-latest
    # The default is 360 minutes. A job that hangs — a service container that
    # never reports healthy, or an async test blocking on a socket — would burn
    # six hours of runner time and leave the PR stuck "in progress". The suite
    # takes about a minute, so this is generous.
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        # 6380, matching docker-compose.yml and the URL in
        # portal/tests/test_health.py — that test skips when nothing is
        # listening, so the port has to agree for it to actually run.
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # DEBUG=True is required, not laziness: with it off, settings.py enables
      # SECURE_SSL_REDIRECT, and Django's test client speaks http — so every
      # request becomes a 301 and the suite fails ~240 tests on redirects alone.
      # Making the suite runnable under production-shaped settings is a separate
      # piece of work.
      DEBUG: 'True'
      # Set explicitly so this keeps working once SECRET_KEY becomes mandatory
      # (PR #52 removes the dev fallback), and so no run depends on a fallback.
      # CI-only value; it signs nothing that outlives the job.
      SECRET_KEY: github-actions-ephemeral-key-not-used-for-anything-real
      # Points the channel layer at the real Redis above, which is what makes
      # test_channel_layer_config execute. That test guards the redis-py 8
      # socket_timeout regression that dropped live connections in production
      # (fbb4339); without REDIS_URL it skips, so it protected nothing.
      REDIS_URL: redis://127.0.0.1:6380/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # requirements.txt pins trinity-atlassian-cli to a git commit; the repo
        # is public, so no credentials are needed here.
        run: pip install -r requirements.txt

      - name: Check for models changed without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test portal --verbosity 2

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # The build is part of the deploy (the Node buildpack runs it, and
        # WhiteNoise serves the result), so a build that fails here would be a
        # deploy that fails in production.
        run: npm run build
