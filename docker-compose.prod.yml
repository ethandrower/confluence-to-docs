# Production-parity stack — run this before a deploy, not for daily work.
#
#   docker compose -f docker-compose.prod.yml up --build
#   open http://localhost:8090
#
# Daily iteration stays on docker-compose.yml (runserver, DEBUG=True, Vite dev
# server, instant reload). This profile exists to answer one question: does the
# thing we are about to push actually run the way production runs it?
#
# What it exercises that dev does NOT:
#   * the real Vue build + collectstatic through
#     CompressedManifestStaticFilesStorage, which RAISES on an unresolvable
#     static reference instead of quietly 404ing
#   * WhiteNoise serving those hashed assets, and Django serving the SPA shell
#     itself — one origin, not the two the Vite proxy gives you
#   * DEBUG=False: secure cookies, SSL redirect, no friendly error pages, and
#     the SECRET_KEY requirement that refuses to boot without one
#   * gunicorn with two uvicorn workers and a 120s timeout, the Procfile's
#     exact web command, instead of single-process autoreload
#   * an nginx hop in front, as Dokku has, so SECURE_PROXY_SSL_HEADER and
#     WebSocket upgrades are actually on the path
#
# What it still does NOT prove: the buildpacks themselves, Mailgun delivery,
# CloudFront, real S3 bucket policy/CORS, and the six cron entries in app.json.
# A staging app on the Dokku host is the only true parity; this is the fast
# check that catches the common breakages first.
#
# Its own project name, ports and volumes throughout, so it can run alongside
# the dev stack without either noticing the other.
name: confluence-to-docs-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - miniodata_prod:/data
    ports:
      - "9020:9000"
      - "9021:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/fileshare-prod-parity &&
             echo 'bucket ready'"

  # Mirrors the Procfile's `release:` phase, which Dokku runs before promoting
  # a new container. Kept as its own one-shot service rather than folded into
  # the web command so that a failed migration fails visibly here, exactly as
  # a failed release phase aborts a deploy.
  release:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    environment: &app_env
      DEBUG: "False"
      # A fixed throwaway key: DEBUG=False refuses to boot without one, and a
      # stable value means sessions survive a restart of this stack. It is
      # public by construction — never reuse it anywhere that matters.
      SECRET_KEY: local-production-parity-only-do-not-use-anywhere-else
      DATABASE_URL: postgres://portal:portal@db:5432/portal
      REDIS_URL: redis://redis:6379/0
      # 'web' is the Host nginx forwards under.
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      # One origin here, unlike dev — the SPA is served by Django itself, so
      # this is the only address in play.
      FRONTEND_URL: http://localhost:8090
      CSRF_TRUSTED_ORIGINS: http://localhost:8090,http://127.0.0.1:8090
      # See settings.py: HSTS is remembered per host, so a real header from
      # `localhost` would force https on every other app you run there. This
      # is the one place that override is meant to be used.
      SECURE_HSTS_SECONDS: "0"
      STAFF_EMAIL_DOMAINS: citemed.com
      MEDIA_ROOT: /app/media
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_REGION_NAME: us-east-1
      FILESHARE_BUCKET: fileshare-prod-parity
      FILESHARE_ENDPOINT_URL: http://minio:9000
      FILESHARE_PUBLIC_ENDPOINT: http://localhost:9020
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    environment: *app_env
    # No source bind mount, deliberately: production runs the code that was
    # built into the image. Mounting the tree over it would put the dev
    # working copy back in front of the built bundle and undo the point.
    expose:
      - "8001"
    depends_on:
      release:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Dokku puts nginx in front of every app; so does this. It is what makes
  # SECURE_PROXY_SSL_HEADER and the WebSocket upgrade path real here.
  proxy:
    image: nginx:alpine
    volumes:
      - ./deploy/local-prod-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - web

volumes:
  pgdata_prod:
  miniodata_prod:
