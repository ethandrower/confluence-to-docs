# Local development stack.
#
#   docker compose up          — Postgres, Redis, the ASGI API and the Vite dev server
#   open http://localhost:5174 — the portal
#
# Secrets (Confluence token, Mailgun, …) come from .env, which is gitignored.
# Copy .env.example to .env first. The `environment:` blocks below deliberately
# override DATABASE_URL / REDIS_URL / ALLOWED_HOSTS from that file so a .env
# written for host-native dev still works unchanged inside compose.

# Pinned so the project (and its pgdata volume) is identified by name rather
# than by the directory compose happens to run from — a git worktree or a
# renamed checkout would otherwise silently start against an empty database.
name: confluence-to-docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so you can psql from the host; harmless if unused.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object store for local dev. Production talks to real S3;
  # without something here, file uploads simply cannot be exercised locally
  # (there are no AWS keys in .env, by design).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Browser PUTs are cross-origin (5174 -> 9000), and multipart needs the
      # ETag of each part readable from JS.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - miniodata:/data
    ports:
      # 9000 API (presigned URLs point here), 9001 console.
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: create the dev bucket, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/fileshare-dev &&
             echo 'bucket ready'"

  web:
    # Dockerfile.dev, not Dockerfile — a root Dockerfile would hijack Dokku's
    # builder detection away from the buildpacks production uses.
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgres://portal:portal@db:5432/portal
      # Redis gives Channels a real cross-process layer, matching production.
      REDIS_URL: redis://redis:6379/0
      # 'web' is the Host the Vite proxy forwards under (changeOrigin: true).
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      FRONTEND_URL: http://localhost:5174
      DEBUG: "True"
      # Our own people become agents on first sign-in (see settings.py).
      STAFF_EMAIL_DOMAINS: citemed.com
      # Keep image writes inside the bind mount so synced attachments survive
      # a container rebuild and are visible on the host.
      MEDIA_ROOT: /app/media
      # Point file sharing at MinIO. FILESHARE_ENDPOINT_URL is how *we* reach
      # it; FILESHARE_PUBLIC_ENDPOINT is what gets baked into presigned URLs,
      # which the browser resolves from the host.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_REGION_NAME: us-east-1
      FILESHARE_BUCKET: fileshare-dev
      FILESHARE_ENDPOINT_URL: http://minio:9000
      FILESHARE_PUBLIC_ENDPOINT: http://localhost:9000
    volumes:
      - .:/app
      # Django writes nothing to these, but keeping them off the bind mount
      # avoids scattering root-owned caches through the working tree.
      - /app/staticfiles
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # runserver speaks ASGI here because 'daphne' leads INSTALLED_APPS, so
    # WebSockets work in dev with autoreload.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8001"

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    environment:
      # Consumed by vite.config.js — inside compose the API is another service,
      # not localhost.
      VITE_PROXY_TARGET: http://web:8001
    volumes:
      - .:/app
      # Anonymous volume: keeps container-built node_modules from overwriting
      # (or being overwritten by) a host install of different binaries.
      - /app/frontend/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - web
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
  miniodata:
