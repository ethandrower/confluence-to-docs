# Local development stack.
#
#   docker compose up          — Postgres, Redis, the ASGI API and the Vite dev server
#   open http://localhost:5174 — the portal
#
# Secrets (Confluence token, Mailgun, …) come from .env, which is gitignored.
# Copy .env.example to .env first. The `environment:` blocks below deliberately
# override DATABASE_URL / REDIS_URL / ALLOWED_HOSTS from that file so a .env
# written for host-native dev still works unchanged inside compose.

# Pinned so the project (and its pgdata volume) is identified by name rather
# than by the directory compose happens to run from — a git worktree or a
# renamed checkout would otherwise silently start against an empty database.
name: confluence-to-docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so you can psql from the host; harmless if unused.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://portal:portal@db:5432/portal
      # Redis gives Channels a real cross-process layer, matching production.
      REDIS_URL: redis://redis:6379/0
      # 'web' is the Host the Vite proxy forwards under (changeOrigin: true).
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      FRONTEND_URL: http://localhost:5174
      DEBUG: "True"
      # Keep image writes inside the bind mount so synced attachments survive
      # a container rebuild and are visible on the host.
      MEDIA_ROOT: /app/media
    volumes:
      - .:/app
      # Django writes nothing to these, but keeping them off the bind mount
      # avoids scattering root-owned caches through the working tree.
      - /app/staticfiles
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # runserver speaks ASGI here because 'daphne' leads INSTALLED_APPS, so
    # WebSockets work in dev with autoreload.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8001"

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    environment:
      # Consumed by vite.config.js — inside compose the API is another service,
      # not localhost.
      VITE_PROXY_TARGET: http://web:8001
    volumes:
      - .:/app
      # Anonymous volume: keeps container-built node_modules from overwriting
      # (or being overwritten by) a host install of different binaries.
      - /app/frontend/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - web
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
